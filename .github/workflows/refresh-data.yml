name: Propose immutable NEON mosquito refresh

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      skip_download:
        description: "Rebuild from committed bundles without downloading RELEASE-2026"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mosquito-release-refresh
  cancel-in-progress: false

env:
  RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MOS_LIVE: "0"
  MOS_RELEASE: RELEASE-2026

jobs:
  gate:
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          dow=$(TZ='America/Phoenix' date +%u)
          day=$(TZ='America/Phoenix' date +%-d)
          if [ "$dow" = "6" ] && [ "$day" -le 7 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  produce_candidate:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
    steps:
      - name: Checkout immutable producer revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up pinned R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5.2"
          use-public-rspm: false
      - name: Install producer dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: neonUtilities, dplyr, tibble
          pak-version: stable
          dependencies: '"hard"'
          cache-version: mosquito-producer-v1
          install-pandoc: "false"
          install-quarto: "false"
      - name: Run opportunity fixtures before network fetch
        run: Rscript --vanilla scripts/test_helpers.R
      - name: Fetch and bundle exact 47-site release in empty staging
        if: ${{ github.event.inputs.skip_download != 'true' }}
        env:
          MOS_RAW_DIR: ${{ runner.temp }}/mosquito-raw
          MOS_SOURCE_RECEIPT: ${{ runner.temp }}/mosquito-data/source-receipt.csv
          MOS_SITE_OUT_DIR: ${{ runner.temp }}/mosquito-data/sites
        run: |
          set -euo pipefail
          mkdir -p "$MOS_RAW_DIR" "$MOS_SITE_OUT_DIR"
          Rscript --vanilla scripts/fetch_mos_all.R
          Rscript --vanilla scripts/bundle_mos_data.R
      - name: Promote complete candidate into worktree
        if: ${{ github.event.inputs.skip_download != 'true' }}
        run: |
          set -euo pipefail
          rm -f data/sites/*.rds
          cp -- "$RUNNER_TEMP"/mosquito-data/sites/*.rds data/sites/
          cp -- "$RUNNER_TEMP"/mosquito-data/site_index.rds data/site_index.rds
          cp -- "$RUNNER_TEMP"/mosquito-data/source-receipt.csv data/source-receipt.csv
          cp -- "$RUNNER_TEMP"/mosquito-data/sites/SRER.rds data-sample/demo.rds
      - name: Package immutable producer candidate
        run: |
          set -euo pipefail
          Rscript --vanilla -e 'source("R/site_metadata.R"); x <- sort(sub("[.]rds$", "", basename(list.files("data/sites", pattern="[.]rds$")))); stopifnot(identical(x, sort(neon_sites$site)))'
          git diff --check
          tar -czf "$RUNNER_TEMP/mosquito-produced-2026.tgz" data/sites data/site_index.rds data/source-receipt.csv data-sample
      - name: Upload producer candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mosquito-produced-2026-${{ github.sha }}
          path: ${{ runner.temp }}/mosquito-produced-2026.tgz
          if-no-files-found: error
          retention-days: 7

  validate_candidate:
    needs: [gate, produce_candidate]
    if: needs.gate.outputs.run == 'true' && needs.produce_candidate.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable validator revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up pinned R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5.2"
          use-public-rspm: false
      - name: Install validator and runtime dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: >
            shiny, bslib, bsicons, dplyr, tidyr, stringr, tibble,
            plotly@4.12.0, leaflet, DT, shinyjs, shinycssloaders, RColorBrewer,
            htmltools, jsonlite, rsconnect, cpp11,
            url::https://cran.r-project.org/src/contrib/Archive/terra/terra_1.8-50.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sf_1.1-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/s2_1.1.11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/units_1.0-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/wk_0.9.5.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/classInt_0.4-11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/raster_3.6-32.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sp_2.2-1.tar.gz
          pak-version: stable
          dependencies: '"hard"'
          cache-version: mosquito-validator-geo-v1
          install-pandoc: "false"
          install-quarto: "false"
      - name: Verify deterministic numeric runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes
          lib = ctypes.CDLL("libopenblas.so.0")
          lib.openblas_get_corename.restype = ctypes.c_char_p
          core = lib.openblas_get_corename().decode("ascii")
          threads = lib.openblas_get_num_threads()
          print(f"OpenBLAS core={core} threads={threads}")
          if core.lower() != "haswell" or threads != 1:
              raise SystemExit("unexpected OpenBLAS runtime")
          PY
      - name: Download immutable producer candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mosquito-produced-2026-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Materialize candidate in clean validator checkout
        run: |
          set -euo pipefail
          rm -f data/sites/*.rds data/source-receipt.csv data/site_index.rds data-sample/demo.rds
          tar -xzf "$RUNNER_TEMP/candidate/mosquito-produced-2026.tgz"
      - name: Independently rebuild all derived indexes
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/build_climate.R
          Rscript --vanilla scripts/build_cross_site.R
          Rscript --vanilla scripts/build_search_index.R
      - name: Generate and verify exact candidate
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/write_manifest.R
          Rscript --vanilla scripts/test_helpers.R
          Rscript --vanilla scripts/verify_bundle.R
          Rscript --vanilla -e 'Sys.setenv(MOS_LIVE="0"); source("global.R"); source("ui.R"); candidate <- source("server.R")$value; stopifnot(inherits(ui,"shiny.tag.list") || inherits(ui,"shiny.tag"),is.function(candidate))'
          node scripts/check_custom_message_handlers.mjs
          node scripts/check_cover.mjs
          bash -n scripts/post_deploy_smoke.sh
          git diff --check
      - name: Package immutable validated candidate
        run: tar -czf "$RUNNER_TEMP/mosquito-release-2026.tgz" data data-sample manifest.json
      - name: Upload validated candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mosquito-release-2026-${{ github.sha }}
          path: ${{ runner.temp }}/mosquito-release-2026.tgz
          if-no-files-found: error
          retention-days: 7

  publish_candidate:
    needs: [gate, validate_candidate]
    if: needs.gate.outputs.run == 'true' && needs.validate_candidate.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout validated producer revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download exact validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mosquito-release-2026-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Publish review branch, never master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor origin/master "$GITHUB_SHA"; then echo "Producer revision does not contain current master; refusing stale publication."; exit 1; fi
          tar -xzf "$RUNNER_TEMP/candidate/mosquito-release-2026.tgz"
          if git diff --quiet -- data data-sample manifest.json; then echo "No validated data change."; exit 0; fi
          branch="automation/mosquito-release-2026"
          remote_head=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
          git switch -C "$branch"
          git config user.name "neon-data-bot"
          git config user.email "neon-data-bot@users.noreply.github.com"
          git add -A data data-sample manifest.json
          git commit -m "data: propose validated mosquito RELEASE-2026 [bot]" -m "Exact 47-site opportunity-complete candidate from ${GITHUB_SHA}."
          if [ -n "$remote_head" ]; then git push --force-with-lease="refs/heads/$branch:$remote_head" origin "$branch:refs/heads/$branch"; else git push origin "$branch:refs/heads/$branch"; fi
          pr_url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
          if [ -z "$pr_url" ]; then
            if ! gh pr create --base master --head "$branch" --title "data: validated mosquito RELEASE-2026" --body "Immutable 47-site candidate from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Merge is the explicit deploy decision."; then
              echo "::notice title=Validated review branch ready::GitHub Actions may not create pull requests in this repository. Open a PR from $branch after reviewing run ${GITHUB_RUN_ID}."
            fi
          else
            gh pr comment "$pr_url" --body "Updated from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
