name: Propose immutable NEON mosquito refresh

on:
  schedule:
    # Every Saturday 13:17 UTC == 06:17 America/Phoenix (no DST), clear of the
    # UTC-midnight edge. Cron cannot say "Nth Saturday of the month", so it fires
    # weekly and the gate job's shared calendar block picks the refresh week.
    - cron: "17 13 * * 6"
  workflow_dispatch:
    inputs:
      skip_download:
        description: "Rebuild from committed bundles without downloading the pinned release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mosquito-release-refresh
  cancel-in-progress: false

env:
  RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MOS_LIVE: "0"
  # The pinned release lives only in R/mos_release.R. Each job that needs it
  # reads it from there into MOS_RELEASE in an early step.

jobs:
  gate:
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REFRESH_WEEK: "1"
        run: |
          # Shared NEON-suite calendar gate. Keep this block byte-identical in every
          # repo; only the REFRESH_WEEK value above it differs. The cron fires every
          # Saturday 13:17 UTC (06:17 America/Phoenix, no DST). GitHub can start a
          # scheduled run hours late, so the gate judges the Saturday the run was
          # scheduled for, not the wall clock: it steps back to the most recent Phoenix
          # Saturday (today, on a Saturday) and proceeds only when that Saturday falls in
          # week REFRESH_WEEK of its month (week 1 = days 1-7, week 2 = days 8-14).
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Calendar gate: $EVENT_NAME run, proceeding." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date -u +%s)
          started=$(TZ='America/Phoenix' date -d "@$now" '+%F %H:%M')
          dow=$(TZ='America/Phoenix' date -d "@$now" +%u)   # 1 = Monday ... 6 = Saturday, 7 = Sunday
          lag_days=$(( (dow + 1) % 7 ))                     # whole days since the most recent Saturday
          saturday_at=$(( now - lag_days * 86400 ))         # Phoenix has no DST, so a day is 86400 s
          saturday=$(TZ='America/Phoenix' date -d "@$saturday_at" +%F)
          saturday_week=$(( ($(TZ='America/Phoenix' date -d "@$saturday_at" +%-d) + 6) / 7 ))
          today_week=$(( ($(TZ='America/Phoenix' date -d "@$now" +%-d) + 6) / 7 ))
          if [ "$saturday_week" = "$REFRESH_WEEK" ]; then
            echo "Calendar gate: run for Saturday $saturday (week $saturday_week) started $started Phoenix, proceeding." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIPPED_BY_CALENDAR: run for Saturday $saturday is week $saturday_week, not week $REFRESH_WEEK (started $started Phoenix)." | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$today_week" = "$REFRESH_WEEK" ]; then
              echo "::warning title=Refresh skipped in its refresh week::Saturday $saturday is week $saturday_week, but this run started $started Phoenix, inside week $REFRESH_WEEK. Confirm the week-$REFRESH_WEEK Saturday run proceeds."
            fi
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe a NEON data endpoint with the token
        if: steps.check.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
          PROBE_URL: https://data.neonscience.org/api/v0/data/DP1.10043.001/SRER/2023-12
        run: |
          # Shared NEON-suite token probe. Keep this block byte-identical in every repo;
          # only PROBE_URL differs. NEON data endpoints refuse anonymous requests, so a
          # missing or rejected token fails here, named, before any download starts.
          set -euo pipefail
          if [ -z "${NEON_TOKEN:-}" ]; then
            echo "::error title=Missing NEON token::Set the NEON_TOKEN repository secret; NEON data endpoints refuse anonymous requests."
            echo "NEON token probe: the NEON_TOKEN secret is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -sS --retry 3 --retry-all-errors --max-time 60 -o "$body" -w '%{http_code}' \
            -H "X-API-Token: $NEON_TOKEN" "$PROBE_URL") || code=000
          files=$(jq -r '.data.files | length' "$body" 2>/dev/null) || files=0
          rm -f "$body"
          if [ "$code" != "200" ] || ! [ "$files" -ge 1 ] 2>/dev/null; then
            echo "::error title=NEON token rejected::HTTP $code with $files files from $PROBE_URL; check or rotate the NEON_TOKEN secret."
            echo "NEON token probe: HTTP $code, $files files from $PROBE_URL." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "NEON token probe: HTTP 200, $files files from $PROBE_URL." | tee -a "$GITHUB_STEP_SUMMARY"

  release_watch:
    # Runs on every trigger, independent of the calendar gate. It only reports:
    # it never fails the run on a network error and never switches the release.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout release pin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Compare NEON's newest release with R/mos_release.R
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRODUCT_URL: https://data.neonscience.org/api/v0/products/DP1.10043.001
        run: |
          set -uo pipefail
          pinned=$(grep -oE '(^|[^_[:alnum:]])release[[:space:]]*=[[:space:]]*"RELEASE-[0-9]{4}"' R/mos_release.R | grep -oE 'RELEASE-[0-9]{4}' | head -n 1)
          if [ -z "$pinned" ]; then
            echo "::warning title=Release watch skipped::R/mos_release.R has no release = \"RELEASE-YYYY\" entry."
            exit 0
          fi
          body=$(mktemp)
          code=$(curl -sS --retry 3 --retry-all-errors --max-time 60 -o "$body" -w '%{http_code}' "$PRODUCT_URL") || code=000
          newest=$(jq -r '.data.releases[].release' "$body" 2>/dev/null | grep -E '^RELEASE-[0-9]{4}$' | sort -V | tail -n 1)
          rm -f "$body"
          if [ "$code" != "200" ] || [ -z "$newest" ]; then
            echo "::warning title=Release watch could not reach NEON::HTTP $code from $PRODUCT_URL; release not checked this run."
            echo "Release watch: HTTP $code from $PRODUCT_URL, release not checked." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$newest" = "$pinned" ] || [ "$(printf '%s\n%s\n' "$pinned" "$newest" | sort -V | tail -n 1)" = "$pinned" ]; then
            echo "Release watch: pinned $pinned is NEON's newest release for DP1.10043.001." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning title=New NEON release::$newest is available for DP1.10043.001; the app is pinned to $pinned. Moving releases is a reviewed change to R/mos_release.R."
          echo "Release watch: NEON $newest is available for DP1.10043.001; pinned release is $pinned." >> "$GITHUB_STEP_SUMMARY"
          title="NEON $newest available for DP1.10043.001"
          issue_body=$(printf 'NEON lists %s for DP1.10043.001. The app is pinned to %s in R/mos_release.R.\n\nMoving releases is a reviewed change to R/mos_release.R plus a full rebuild through the review branch.\n\nRun: %s\n' \
            "$newest" "$pinned" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          gh label create neon-release --force --color 1D76DB --description "NEON published a release newer than the pinned one" \
            || echo "::warning::Could not create the neon-release label."
          issue_number=$(gh issue list --label neon-release --state open --json number --jq '.[0].number // empty') || issue_number=""
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --title "$title" || echo "::warning::Could not retitle issue $issue_number."
            gh issue comment "$issue_number" --body "$issue_body" || echo "::warning::Could not comment on issue $issue_number."
          else
            gh issue create --title "$title" --label neon-release --body "$issue_body" || echo "::warning::Could not open the neon-release issue."
          fi
          exit 0

  produce_candidate:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout immutable producer revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Read the pinned release from R/mos_release.R
        run: |
          set -euo pipefail
          release=$(grep -oE '(^|[^_[:alnum:]])release[[:space:]]*=[[:space:]]*"RELEASE-[0-9]{4}"' R/mos_release.R | grep -oE 'RELEASE-[0-9]{4}' | head -n 1 || true)
          if [ -z "$release" ]; then echo "::error title=Release not found::R/mos_release.R has no release = \"RELEASE-YYYY\" entry."; exit 1; fi
          echo "MOS_RELEASE=$release" >> "$GITHUB_ENV"
          echo "Pinned release: $release (from R/mos_release.R)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Set up pinned R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5.2"
          use-public-rspm: false
      - name: Install producer dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: neonUtilities, dplyr, tibble, jsonlite
          pak-version: stable
          dependencies: '"hard"'
          cache-version: mosquito-producer-v1
          install-pandoc: "false"
          install-quarto: "false"
      - name: Check the NEON issue log against the pinned release
        run: Rscript --vanilla scripts/check_neon_issue_log.R
      - name: Run opportunity fixtures before network fetch
        run: Rscript --vanilla scripts/test_helpers.R
      - name: Fetch and bundle exact 47-site release in empty staging
        if: ${{ github.event.inputs.skip_download != 'true' }}
        env:
          MOS_RAW_DIR: ${{ runner.temp }}/mosquito-raw
          MOS_SOURCE_RECEIPT: ${{ runner.temp }}/mosquito-data/source-receipt.csv
          MOS_SITE_OUT_DIR: ${{ runner.temp }}/mosquito-data/sites
          NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$MOS_RAW_DIR" "$MOS_SITE_OUT_DIR"
          Rscript --vanilla scripts/fetch_mos_all.R
          Rscript --vanilla scripts/bundle_mos_data.R
      - name: Promote complete candidate into worktree
        if: ${{ github.event.inputs.skip_download != 'true' }}
        run: |
          set -euo pipefail
          rm -f data/sites/*.rds
          cp -- "$RUNNER_TEMP"/mosquito-data/sites/*.rds data/sites/
          cp -- "$RUNNER_TEMP"/mosquito-data/site_index.rds data/site_index.rds
          cp -- "$RUNNER_TEMP"/mosquito-data/source-receipt.csv data/source-receipt.csv
          cp -- "$RUNNER_TEMP"/mosquito-data/sites/SRER.rds data-sample/demo.rds
      - name: Package immutable producer candidate
        run: |
          set -euo pipefail
          Rscript --vanilla -e 'source("R/site_metadata.R"); x <- sort(sub("[.]rds$", "", basename(list.files("data/sites", pattern="[.]rds$")))); stopifnot(identical(x, sort(neon_sites$site)))'
          git diff --check
          tar -czf "$RUNNER_TEMP/mosquito-produced-2026.tgz" data/sites data/site_index.rds data/source-receipt.csv data-sample
      - name: Upload producer candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mosquito-produced-2026-${{ github.sha }}
          path: ${{ runner.temp }}/mosquito-produced-2026.tgz
          if-no-files-found: error
          retention-days: 7

  validate_candidate:
    needs: [gate, produce_candidate]
    if: needs.gate.outputs.run == 'true' && needs.produce_candidate.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable validator revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up pinned R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5.2"
          use-public-rspm: false
      - name: Install validator and runtime dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: >
            shiny, bslib@0.11.0, bsicons, dplyr, tidyr, stringr, tibble,
            plotly@4.12.0, leaflet, DT, shinyjs, shinycssloaders, RColorBrewer,
            htmltools, jsonlite, rsconnect, cpp11,
            url::https://cran.r-project.org/src/contrib/Archive/terra/terra_1.8-50.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sf_1.1-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/s2_1.1.11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/units_1.0-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/wk_0.9.5.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/classInt_0.4-11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/raster_3.6-32.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sp_2.2-1.tar.gz
          pak-version: stable
          dependencies: '"hard"'
          cache-version: mosquito-validator-geo-v2
          install-pandoc: "false"
          install-quarto: "false"
      - name: Verify deterministic numeric runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes
          lib = ctypes.CDLL("libopenblas.so.0")
          lib.openblas_get_corename.restype = ctypes.c_char_p
          core = lib.openblas_get_corename().decode("ascii")
          threads = lib.openblas_get_num_threads()
          print(f"OpenBLAS core={core} threads={threads}")
          if core.lower() != "haswell" or threads != 1:
              raise SystemExit("unexpected OpenBLAS runtime")
          PY
      - name: Download immutable producer candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mosquito-produced-2026-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Materialize candidate in clean validator checkout
        run: |
          set -euo pipefail
          rm -f data/sites/*.rds data/source-receipt.csv data/site_index.rds data-sample/demo.rds
          tar -xzf "$RUNNER_TEMP/candidate/mosquito-produced-2026.tgz"
      - name: Independently rebuild all derived indexes
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/build_climate.R
          Rscript --vanilla scripts/build_cross_site.R
          Rscript --vanilla scripts/build_search_index.R
      - name: Generate and verify exact candidate
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/write_manifest.R
          Rscript --vanilla scripts/test_helpers.R
          Rscript --vanilla scripts/verify_bundle.R
          Rscript --vanilla -e 'Sys.setenv(MOS_LIVE="0"); source("global.R"); source("ui.R"); candidate <- source("server.R")$value; stopifnot(inherits(ui,"shiny.tag.list") || inherits(ui,"shiny.tag"),is.function(candidate))'
          node scripts/check_custom_message_handlers.mjs
          node scripts/check_cover.mjs
          bash -n scripts/post_deploy_smoke.sh
          git diff --check
      - name: Package immutable validated candidate
        run: tar -czf "$RUNNER_TEMP/mosquito-release-2026.tgz" data data-sample manifest.json
      - name: Upload validated candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mosquito-release-2026-${{ github.sha }}
          path: ${{ runner.temp }}/mosquito-release-2026.tgz
          if-no-files-found: error
          retention-days: 7

  publish_candidate:
    needs: [gate, validate_candidate]
    if: needs.gate.outputs.run == 'true' && needs.validate_candidate.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout validated producer revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Read the pinned release from R/mos_release.R
        run: |
          set -euo pipefail
          release=$(grep -oE '(^|[^_[:alnum:]])release[[:space:]]*=[[:space:]]*"RELEASE-[0-9]{4}"' R/mos_release.R | grep -oE 'RELEASE-[0-9]{4}' | head -n 1 || true)
          if [ -z "$release" ]; then echo "::error title=Release not found::R/mos_release.R has no release = \"RELEASE-YYYY\" entry."; exit 1; fi
          echo "MOS_RELEASE=$release" >> "$GITHUB_ENV"
          echo "Pinned release: $release (from R/mos_release.R)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Download exact validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mosquito-release-2026-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Publish review branch, never master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor origin/master "$GITHUB_SHA"; then echo "Producer revision does not contain current master; refusing stale publication."; exit 1; fi
          [[ -d data && ! -L data && -d data-sample && ! -L data-sample ]]
          find data data-sample -mindepth 1 -delete
          tar -xzf "$RUNNER_TEMP/candidate/mosquito-release-2026.tgz"
          # Stage before the noop test so new untracked files count as a change.
          # git switch -C below keeps the index, so the staged candidate rides along.
          git add -A -- data data-sample manifest.json
          if git diff --cached --quiet; then
            echo "No validated data change: candidate identical to master" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="automation/mosquito-release-2026"
          remote_head=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
          git switch -C "$branch"
          git config user.name "neon-data-bot"
          git config user.email "neon-data-bot@users.noreply.github.com"
          git commit -m "data: propose validated mosquito ${MOS_RELEASE} [bot]" -m "Exact 47-site opportunity-complete candidate from ${GITHUB_SHA}."
          published_commit=$(git rev-parse HEAD)
          if [[ "$(git rev-parse HEAD^)" != "$GITHUB_SHA" ]]; then
            echo "Candidate promotion commit is not a direct child of the validated producer revision."
            exit 1
          fi
          if [ -n "$remote_head" ] && [ "$remote_head" != "$published_commit" ]; then
            echo "::warning title=Replacing a waiting candidate::automation branch head $remote_head is replaced by $published_commit; any unmerged review of the old head is superseded."
            echo "Replaced waiting candidate $remote_head" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$remote_head" ]; then git push --force-with-lease="refs/heads/$branch:$remote_head" origin "$branch:refs/heads/$branch"; else git push origin "$branch:refs/heads/$branch"; fi
          pushed_commit=""
          for attempt in 1 2 3 4 5; do
            pushed_commit=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
            [[ "$pushed_commit" == "$published_commit" ]] && break
            sleep 2
          done
          if [[ "$pushed_commit" != "$published_commit" ]]; then
            echo "Published branch does not resolve to the validated candidate commit."
            exit 1
          fi
          echo "Published $published_commit to $branch" | tee -a "$GITHUB_STEP_SUMMARY"

          # One open data-refresh issue tells a person a candidate is waiting.
          # The workflow never opens or merges the PR; a person does both.
          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/master...${branch}?expand=1"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # shellcheck disable=SC2016 # the backticks are Markdown code spans, not command substitution
          issue_body=$(printf 'Validated candidate `%s` is on `%s`.\n\n- Compare and open the PR: %s\n- Run: %s\n\nReview the diff, open the PR to master, wait for green checks on that exact head, then merge.\n' \
            "$published_commit" "$branch" "$compare_url" "$run_url")
          # The branch is already pushed; a failure here only loses the reminder, so it warns.
          gh label create data-refresh --force --color 0E8A16 --description "A validated data refresh is waiting for review" \
            || echo "::warning::Could not create the data-refresh label."
          issue_number=$(gh issue list --label data-refresh --state open --json number --jq '.[0].number // empty') || issue_number=""
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$issue_body" || echo "::warning::Could not comment on issue $issue_number."
          else
            gh issue create --title "Mosquito refresh candidate waiting" --label data-refresh --body "$issue_body" \
              || echo "::warning::Could not open the data-refresh issue."
          fi

          pr_count=$(gh pr list --head "$branch" --base master --state open \
            --json url --jq 'length')
          if (( pr_count > 1 )); then
            echo "More than one open master PR exists for $branch; refusing ambiguous publication."
            exit 1
          fi
          if (( pr_count == 0 )); then
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/master...${branch}?expand=1"
            {
              echo "### Validated Mosquito review branch ready"
              echo "- Branch: \`$branch\`"
              echo "- Exact head: \`$published_commit\`"
              echo "- Validator run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- [Open the reviewer-authenticated PR]($compare_url)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Validated review branch ready::Open a reviewer-authenticated PR from $branch to master after reviewing run ${GITHUB_RUN_ID}; that PR event is the exact-head CI trigger."
            exit 0
          fi

          pr_record=""
          for attempt in 1 2 3 4 5; do
            pr_record=$(gh pr list --head "$branch" --base master --state open \
              --json url,baseRefName,headRefName,headRefOid \
              --jq 'if length == 1 then .[0] | [.url,.baseRefName,.headRefName,.headRefOid] | @tsv else "" end')
            [[ "$pr_record" == *$'\t'"$published_commit" ]] && break
            sleep 2
          done
          IFS=$'\t' read -r pr_url pr_base pr_head pr_oid <<< "$pr_record"
          if [[ -z "$pr_record" || "$pr_base" != master || "$pr_head" != "$branch" || \
                "$pr_oid" != "$published_commit" ]]; then
            echo "Open PR identity does not match master <- $branch at $published_commit."
            exit 1
          fi
          gh pr comment "$pr_url" \
            --body "Updated from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. GitHub will hold the pull_request synchronize checks triggered by this automation update for approval; a repository write user must select **Approve workflows to run**. Do not merge until checks are green on exact head ${published_commit}."
          echo "::notice title=Approve exact-head PR checks::Existing PR updated to $published_commit. A repository write user must select Approve workflows to run, then verify green checks on that exact head."
